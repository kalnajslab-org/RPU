; PlatformIO Project Configuration File for RPU
;
; Two build environments each have their own source directory.
; Shared hardware definitions live in include/ProfilerHardware.h.
;
; Build a specific environment:
;   pio run -e RPU
;   pio run -e RPUtest

[common]
platform = teensy
board = teensy41
framework = arduino
extra_scripts =
  pre:version_header.py
  post:hex_save.py
custom_version_header_dir = include
board_build.f_cpu = 150000000L
lib_deps =
  https://github.com/kalnajslab-org/SerialComm.git
  https://github.com/kalnajslab-org/RPUComm.git
  https://github.com/kalnajslab-org/Tsensor1Wire.git
  https://github.com/kalnajslab-org/RS41.git
  mikalhart/TinyGPSPlus@^1.1.0
  https://github.com/tonton81/WDT_T4.git
  LoRa
  paulstoffregen/Time@^1.6.1
  etlcpp/Embedded Template Library@20.47.1

[env:RPU]
extends = common
build_src_filter = -<*> +<RPU/>

[env:RPUtest]
extends = common
build_src_filter = -<*> +<RPUtest/>
